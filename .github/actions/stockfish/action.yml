# The engine, for a job that needs the real one.
#
# Both the unit suite (`it.skipIf(!stockfish)`) and the e2e suite
# (`test.skip`) step over their engine cases when `STOCKFISH_PATH` names
# nothing, so a job without this passes while proving less than it appears to.
#
# The same release and the same checksum as `Dockerfile`, because a suite that
# proves the engine against a different build proves less than it looks. The
# two are pinned by hand and go stale together — docs/TRACKER.md carries that.
name: Install Stockfish
description: The pinned Stockfish 18 build, verified and on PATH.

outputs:
  path:
    description: Where the binary landed.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
        sum=536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964
        dest=/usr/local/bin/stockfish

        curl -fsSL -o /tmp/stockfish.tar "$url"
        echo "$sum  /tmp/stockfish.tar" | sha256sum -c -
        tar -xf /tmp/stockfish.tar -C /tmp
        sudo mv /tmp/stockfish/stockfish-ubuntu-x86-64-avx2 "$dest"

        # Proves it runs here, rather than only that it downloaded: a binary
        # for the wrong CPU dies on this line and not inside a test.
        echo "uci" | "$dest" | grep -q '^uciok$'
        echo "path=$dest" >> "$GITHUB_OUTPUT"
