# Is this branch correct? Runs on every pull request, and again on main as the
# gate `deploy.yml` waits for.
#
# Nothing here holds a credential. The unit suite is pure functions and jsdom,
# and the e2e suite builds its own database in a service container, so a fork's
# pull request runs the whole thing and a mistake in this file cannot leak a
# secret. Secrets start in `deploy.yml` and stay there.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch is wasted minutes, not evidence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to what wrote pnpm-lock.yaml. `package.json` names no
  # `packageManager`, so this and the Dockerfile's own pin are two copies of
  # one fact — the third would be the one to fix that.
  PNPM_VERSION: 10.30.1
  NODE_VERSION: 22

jobs:
  check:
    name: Types, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, not after: `cache: pnpm` shells out to
      # `pnpm store path` and fails if pnpm is not installed yet.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The same three belts the image uses: onnxruntime-node's postinstall
      # fetches CUDA and TensorRT providers nothing here runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # Here too, not only in e2e: the lowest layer holding "the engine returns
      # a move this Position allows" is a unit test, and it skips itself
      # without a binary.
      - uses: ./.github/actions/stockfish

      # Each named, so a red run says which one without opening the log.
      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm check

      - name: Unit and DOM tests
        run: pnpm test
        env:
          STOCKFISH_PATH: /usr/local/bin/stockfish
          ENGINE_MOVETIME_MS: 200

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    services:
      # Matches docker-compose.yml, down to the port, so E2E_DATABASE_URL reads
      # the same here as it does on a laptop. The PGDATA move in postgres 18
      # that compose works around cannot bite: a service container mounts no
      # volume and is destroyed with the job.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn-chess
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learn-chess"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # `scripts/e2e-db.ts` drops and rebuilds this database every run, and
      # refuses to name the maintenance one.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/learn-chess-e2e
      STOCKFISH_PATH: /usr/local/bin/stockfish
      ENGINE_MOVETIME_MS: 200
      BETTER_AUTH_SECRET: e2e-not-a-secret-this-database-is-thrown-away

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - uses: ./.github/actions/stockfish

      # Not cached: Playwright's own CI guidance is that restoring costs about
      # what downloading costs, and the apt libraries `--with-deps` installs
      # are not in that cache anyway.
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Provisioning is playwright.config.ts's own job — it runs `pnpm e2e:db`
      # inside `webServer.command`, because Playwright starts the server before
      # globalSetup and the database has to exist by then.
      - name: End-to-end tests
        run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
